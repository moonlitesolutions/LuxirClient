[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luxir-client"
version = "0.1.1"
description = "Python client for the Luxir search engine (https://luxir.org/)"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "moonlitesolutions" },
]
keywords = ["luxir", "search", "search-engine", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "requests>=2.20",
]

[project.urls]
Homepage = "https://github.com/moonlitesolutions/LuxirClient"
Repository = "https://github.com/moonlitesolutions/LuxirClient"
Issues = "https://github.com/moonlitesolutions/LuxirClient/issues"
"Luxir Search Engine" = "https://luxir.org/"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["luxir_client*"]
